<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Ninja - Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <div class="menu-bg"></div>

  <!-- Floating Fruits -->
  <div class="floating-fruits">
    <img class="fruit" src="images/apple.png"/>
    <img class="fruit" src="images/banana.png"/>
    <img class="fruit" src="images/watermelon.png"/>
    <img class="fruit" src="images/strawberry.png"/>
    <img class="fruit" src="images/peach.png"/>
    <img class="fruit" src="images/apple.png"/>
    <img class="fruit" src="images/banana.png"/>
    <img class="fruit" src="images/watermelon.png"/>
  </div>

  <!-- Game stage for thrown fruit animation -->
  <div class="game-stage hidden" id="gameStage"></div>

  <!-- Score display -->
  <div class="score-panel hidden" id="scorePanel">
    <div class="score-label">SCORE</div>
    <div class="score-value" id="scoreValue">0</div>
  </div>

  <!-- Lives display -->
  <div class="lives-panel hidden" id="livesPanel">
    <img class="lives-icon" id="life1" src="images/x1.png" alt="Live 1" />
    <img class="lives-icon" id="life2" src="images/x1.png" alt="Live 2" />
    <img class="lives-icon" id="life3" src="images/x1.png" alt="Live 3" />
  </div>

  <!-- Game over menu -->
  <div class="game-over-menu hidden" id="gameOverMenu">
    <img class="game-over-image" src="images/game-over.png" alt="Game Over" />
    <div class="game-over-text">Your Score</div>
    <div class="game-over-score" id="gameOverScore">0</div>
    <div class="game-over-highscore">Best <span id="gameOverHighScore">0</span></div>
    <button class="btn btn-play" id="retryBtn">Retry</button>
    <button class="btn btn-scores" id="returnToMenuBtn">Return to Menu</button>
  </div>

  <!-- Main Menu Card -->
  <div class="menu-card">

    <!-- Logo -->
    <img class="logo" src="images/logo.png" alt="Fruit Ninja" />

    <!-- Tagline -->
    <div class="tagline">⚔ Slice &amp; Dice ⚔</div>

    <!-- High Score Display -->
    <div class="menu-highscore">High Score <span id="highScoreValue">0</span></div>

    <!-- Play Button -->
    <button class="btn btn-play" id="playBtn">▶ &nbsp;Play</button>

    <!-- Decorative fruit row -->
    <div class="slice-deco">
      <img src="images/apple.png"/>
      <img src="images/strawberry.png"/>
      <img src="images/watermelon.png"/>
      <img src="images/banana.png"/>
      <img src="images/peach.png"/>
    </div>
  </div>

  <!-- Blade Trail (cursor effect) -->
  <div class="blade-trail" id="bladeTrail"></div>

  <script src="script.js"></script>
</body>
</html>
